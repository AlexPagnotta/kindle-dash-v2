# Compose file for the ZimaOS UI (Apps -> "+" -> Install a customized app).
# The UI always pulls, so the image is served by a registry running on the box itself.
# Build and publish it over SSH first, or just run deploy/update.sh:
#   cd /DATA/AppData/kindle-dash && git pull
#   DOCKER_CONFIG=… docker build -t localhost:5000/kindle-dash:latest .
#   DOCKER_CONFIG=… docker push localhost:5000/kindle-dash:latest
name: kindle-dash

services:
  kindle-dash:
    image: localhost:5000/kindle-dash:latest
    container_name: kindle-dash
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Chromium crashes on the default 64MB /dev/shm
    shm_size: "1gb"
    environment:
      TZ: Europe/Rome
      DASH_TZ: Europe/Rome
      DASH_PRERENDER: "1"
      DASH_TTL_MS: "300000"
      SCREEN_WIDTH: "800"
      SCREEN_HEIGHT: "600"
      DASH_ROTATE: "90"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_us: Dashboard and PNG endpoint

x-casaos:
  architectures:
    - amd64
  main: kindle-dash
  author: AlexPagnotta
  developer: AlexPagnotta
  category: Utilities
  title:
    en_us: Kindle Dash
  tagline:
    en_us: E-ink dashboard rendered for a jailbroken Kindle
  description:
    en_us: >-
      Renders a dashboard with headless Chromium and serves it as a PNG at
      /api/dash.png, which the Kindle fetches and draws on its e-ink panel.
  index: /
  port_map: "3000"
  scheme: http
